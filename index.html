  <meta charset="utf-8">
  <title>Missão Olimpíadas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- A mesma raiz da Missão ENEM, e pelo mesmo motivo: sem ela um endereço profundo pede o bundle
       na pasta errada. As rotas da criança e do responsável entram na task_08. -->
  <base href="/missao-olimpiadas-releases/">
  <meta name="color-scheme" content="light dark">
  <!-- O carimbo de versão, numa linha só da árvore entregue. Quem o lê é a barra de baixo
       (projects/shell/src/lib/stamp.ts, que explica por que ele mora aqui e não num JSON
       importado); quem o escreve é `node tools/build.ts stamp`, depois do `ng build`. -->
  <meta name="carimbo" content="versão 155 · 22/11/2026">
  <!-- O tema, antes da primeira pintura: qualquer coisa mais tarde pisca claro e só depois
       escurece. Mora numa chave própria do aparelho, fora do estado e fora do código de backup.
       A chave mantém o NOME de 2026 (`missao-olimpiadas-tema`) porque é dado no aparelho de quem
       usa (BR-20), e cada produto tem a SUA: os dois nunca dividem preferência no mesmo navegador
       (US-001 AC-3). Os identificadores em volta é que são em inglês (ADR-015 §6).
       Vira o ThemeService de projects/shell na task_05; aqui é o mínimo para a casca abrir no
       tema certo. -->
  <script>
    (function () {
      var K = "missao-olimpiadas-tema", r = document.documentElement;
      if (!(window.CSS && CSS.supports && CSS.supports("color", "light-dark(#fff,#000)"))) return;
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      function read() {
        try { var v = localStorage.getItem(K); return (v === "claro" || v === "escuro") ? v : "sistema"; }
        catch (e) { return "sistema"; }
      }
      function apply(choice) {
        r.dataset.choice = choice;
        r.dataset.theme = choice === "sistema" ? (mq.matches ? "escuro" : "claro") : choice;
      }
      apply(read());
      function follow() { apply(read()); window.dispatchEvent(new Event("tema")); }
      mq.addEventListener("change", follow);
      window.addEventListener("storage", function (e) { if (e.key === K) follow(); });
    })();
  </script>
